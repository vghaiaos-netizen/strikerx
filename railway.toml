[build]
builder = "nixpacks"

[[services]]
name = "api-server"
source = "."
build_command = "pnpm install && pnpm --filter @workspace/db run push && pnpm --filter @workspace/api-server run build"
start_command = "pnpm --filter @workspace/api-server run start"

[[services.variables]]
PORT = "5000"
NODE_ENV = "production"

[[services]]
name = "strikerx-frontend"
source = "."
build_command = "pnpm install && pnpm --filter @workspace/api-spec run codegen && pnpm --filter @workspace/strikerx run build"
start_command = "npx serve artifacts/strikerx/dist/public -p $PORT"
